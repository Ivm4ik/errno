# Optional. The browser still calls the published API port.
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file: .env
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
  web:
    image: node:22-slim
    working_dir: /web
    volumes:
      - ./vita-astronaut-health-monitor/frontend:/web
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
