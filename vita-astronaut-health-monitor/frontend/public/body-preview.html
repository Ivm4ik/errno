<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <title>ERRNO body preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070a10;
        color: #fff;
        font: 14px system-ui, sans-serif;
      }
      #c {
        width: 100%;
        height: 100%;
        display: block;
      }
      #s {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="s">Завантаження…</div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const status = document.getElementById("s");
      const canvas = document.getElementById("c");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.setClearColor(0x070a10);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.45;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 40);
      const root = new THREE.Group();
      scene.add(root);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x1b2433, 1.4));
      const key = new THREE.DirectionalLight(0xffffff, 2.6);
      key.position.set(2.5, 4, 3);
      scene.add(key);
      scene.add(new THREE.DirectionalLight(0x9db7ff, 1.1).translateX(-3));

      const mat = new THREE.MeshStandardMaterial({
        color: 0xb8bdc8,
        roughness: 0.48,
        metalness: 0.08,
        emissive: 0x1c2230,
        emissiveIntensity: 0.28,
        side: THREE.DoubleSide,
      });

      function fit(model, h = 1.75) {
        model.updateWorldMatrix(true, true);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        model.scale.multiplyScalar(h / Math.max(size.y, 0.001));
        model.updateWorldMatrix(true, true);
        const box2 = new THREE.Box3().setFromObject(model);
        const c = box2.getCenter(new THREE.Vector3());
        model.position.x -= c.x;
        model.position.z -= c.z;
        model.position.y -= box2.min.y;
        return box2.getSize(new THREE.Vector3()).y || h;
      }

      function paint(rootObj) {
        rootObj.traverse((o) => {
          if (o.isMesh) {
            o.material = mat;
            o.frustumCulled = false;
          }
        });
      }

      const urls = ["/models/body.glb", "/models/body-alt.glb"];
      const loader = new GLTFLoader();
      const tryLoad = (i) =>
        new Promise((resolve, reject) => {
          if (i >= urls.length) return reject(new Error("none"));
          loader.load(
            urls[i],
            (g) => resolve(g),
            undefined,
            () => tryLoad(i + 1).then(resolve, reject),
          );
        });

      let bodyH = 1.75;
      let rot = 0.4;
      tryLoad(0)
        .then((gltf) => {
          const model = gltf.scene;
          paint(model);
          if (gltf.animations?.length) {
            const mixer = new THREE.AnimationMixer(model);
            const a = mixer.clipAction(gltf.animations[0]);
            a.play();
            a.paused = true;
            mixer.update(0);
          }
          bodyH = fit(model);
          root.add(model);
          status.textContent = "";
        })
        .catch(() => {
          status.textContent = "Модель не завантажилась";
        });

      function resize() {
        const w = innerWidth;
        const h = innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();

      function frame() {
        requestAnimationFrame(frame);
        rot += 0.008;
        root.rotation.y = rot;
        const lookY = bodyH * 0.55;
        camera.position.set(0, lookY + 0.08, Math.max(2.8, bodyH * 1.9));
        camera.lookAt(0, lookY, 0);
        renderer.render(scene, camera);
      }
      frame();
    </script>
  </body>
</html>
